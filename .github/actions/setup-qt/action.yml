name: Set up Qt
description: Install the shared, reproducible Qt toolchain for tests and release artifacts.
runs:
  using: composite
  steps:
    - name: Install Qt 6.11.2
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
      with:
        version: '6.11.2'
        modules: qtwebsockets qtimageformats
        cache: true
