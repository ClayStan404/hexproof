name: Set up Qt
description: Install the shared, reproducible Qt toolchain for tests and release artifacts.
runs:
  using: composite
  steps:
    - name: Install Qt 6.11.2
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
      with:
        version: '6.11.2'
        # Qt 6.11 splits Windows repositories by compiler. aqt 3.3.0 cannot
        # resolve them; pin the merged upstream fix until a release includes it.
        # https://github.com/miurahr/aqtinstall/pull/1000
        aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b' || '' }}
        aqtversion: '==3.3.0'
        modules: qtwebsockets qtimageformats qtshadertools qtmultimedia
        cache: true
