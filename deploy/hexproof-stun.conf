# Coturn 4.6.1: address discovery only; game relay stays with the Hexproof hub.
listening-port=3478
listening-ip=0.0.0.0
stun-only
no-tcp
no-tls
no-dtls
no-cli
relay-threads=0

# Keep binding responses small and omit legacy discovery/version attributes.
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
no-software-attribute
log-file=stdout
