# Install as hexproof-cert-renew.service.d/health.conf. No ExecStart replacement.
[Service]
StateDirectory=hexproof-health-cloud
StateDirectoryMode=0700
# Record systemd's real INVOCATION_ID/SERVICE_RESULT/EXIT_CODE/EXIT_STATUS.
# '-' preserves certbot's result even if the metadata-only recorder fails.
ExecStopPost=-/usr/bin/python3 /usr/local/lib/hexproof-health/health_alerts.py renewal --source renewal-cloud --config /etc/hexproof-health/renewal.json --state /var/lib/hexproof-health-cloud
